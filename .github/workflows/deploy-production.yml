name: Deploy Production

# Implements Doc 14 (Deployment Strategy) §3 step 3: manual promotion via release PR/tag
# to the `production` branch. Includes a manual approval gate on the migration step,
# per Doc 14 §3 and Doc 18 §9 (destructive migrations are never auto-applied).
#
# NOTE: same caveat as deploy-staging.yml — not functional until infra/secrets exist.

on:
  push:
    branches: [production]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy apps/web to Vercel (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: echo "TODO: vercel deploy --prod --token=\$VERCEL_TOKEN --scope=riznexia"

  deploy-api:
    name: Deploy apps/api to Railway (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: echo "TODO: railway up --service=api --environment=production"

  migrate:
    name: Run Prisma migrations (production)
    runs-on: ubuntu-latest
    needs: [deploy-api]
    environment:
      name: production-migrations
      # A required reviewer on the "production-migrations" GitHub Environment is the
      # manual approval gate referenced in Doc 14 §3 — configure it in repo settings
      # once the repo exists on GitHub.
    steps:
      - uses: actions/checkout@v4
      - name: Migrate
        run: echo "TODO: pnpm --filter @riznexia/db exec prisma migrate deploy"

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-web, migrate]
    steps:
      - name: Hit health endpoint
        run: echo "TODO: curl --fail https://api.riznexia.internal/api/v1/health"
