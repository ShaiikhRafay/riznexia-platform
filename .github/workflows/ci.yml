name: CI

# Implements Doc 14 (Deployment Strategy) §3 step 1 and Doc 13 (Testing Strategy) §5:
# lint + typecheck + test + build gate every PR before merge is allowed.

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client is generated code (not committed); without this the
      # typecheck of packages/db and everything importing @prisma/client fails.
      - name: Generate Prisma client
        run: pnpm --filter @riznexia/db generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
        env:
          # admin-web validates this at build time; any valid URL works for CI
          # (the real value is set in Vercel).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
