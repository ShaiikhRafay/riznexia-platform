name: Deploy Staging

# Implements Doc 14 (Deployment Strategy) §3 step 2: on merge to main, deploy web (Vercel)
# and api (Railway) to staging, then run Prisma migrations against the staging DB.
#
# NOTE: this workflow references secrets that do not exist until the corresponding
# infra is provisioned (Doc 21, Module M0 task "provision Neon, Railway, Vercel, ...").
# It will not run successfully until VERCEL_TOKEN / RAILWAY_TOKEN / DATABASE_URL_STAGING
# are added as repository secrets. Left in place now so the pipeline shape is reviewed
# alongside the rest of the scaffolding, not bolted on later.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy apps/web to Vercel (staging)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: echo "TODO: vercel deploy --token=\$VERCEL_TOKEN --scope=riznexia (staging alias)"
        # Replace with the official `amondnet/vercel-action` or `vercel deploy` CLI call
        # once the Vercel project exists (Doc 04 §6 / Doc 21 M0).

  deploy-api:
    name: Deploy apps/api to Railway (staging)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: echo "TODO: railway up --service=api --environment=staging"
        # Replace with the official Railway GitHub Action once the service exists.

  migrate:
    name: Run Prisma migrations (staging)
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v4
      - name: Migrate
        run: echo "TODO: pnpm --filter @riznexia/db exec prisma migrate deploy"
        # Doc 18 §9 — additive-first migrations, no destructive changes here.
