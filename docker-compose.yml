# Local development services only. Staging/production use Neon (Postgres) and
# Upstash (Redis) as managed services (Doc 04, Doc 16) — this compose file exists
# so a developer can run the full stack locally without cloud accounts on Day 1,
# per Doc 14 (Deployment Strategy) §2: "Local | local Postgres or Neon dev branch".

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riznexia
      POSTGRES_PASSWORD: riznexia_dev
      POSTGRES_DB: riznexia_dev
    ports:
      - '5432:5432'
    volumes:
      - riznexia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riznexia']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # @upstash/redis speaks Upstash's HTTP REST protocol, not the standard
  # Redis wire protocol the `redis` service above exposes — this proxy
  # bridges the two so packages/cache works locally without a real Upstash
  # account. See DECISIONS.md D-006. Point UPSTASH_REDIS_REST_URL at
  # http://localhost:8079 and UPSTASH_REDIS_REST_TOKEN at any non-empty
  # value locally (SRH doesn't check it unless configured to).
  redis-http-proxy:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev-token
      SRH_CONNECTION_STRING: 'redis://redis:6379'

volumes:
  riznexia_postgres_data:
